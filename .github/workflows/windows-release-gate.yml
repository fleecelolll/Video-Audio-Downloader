name: Windows release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install-and-repair:
    name: ${{ matrix.runner }} clean install and repair
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONNOUSERSITE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify immediate prerequisite failures without downloads
        shell: powershell
        run: '& ".github/scripts/Test-PreDownloadChecks.ps1"'

      - name: Prepare a clean release folder with spaces
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Video Downloader release QA'
          if (Test-Path -LiteralPath $root) { throw 'The release QA folder must start empty.' }
          if ('${{ matrix.runner }}' -eq 'windows-11-arm') {
            $zip = Join-Path $env:RUNNER_TEMP 'Video-Audio-Downloader-v1.0.14.zip'
            & '.github/scripts/Build-ReleaseZip.ps1' -OutputPath $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $root
          } else {
            New-Item -ItemType Directory -Path $root | Out-Null
            foreach ($name in @('Installer.bat', 'Video + Audio Downloader.pyw', 'Video Downloader.pyw', 'LICENSE', 'READ ME.txt')) {
              Copy-Item -LiteralPath $name -Destination $root
            }
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "FLEECE_RELEASE_ROOT=$root`n", [Text.UTF8Encoding]::new($false))

      - name: Perform a clean private setup and app self-test through the confirmation prompt
        shell: cmd
        run: echo Y| call "%FLEECE_RELEASE_ROOT%\Installer.bat" --no-pause

      - name: Verify the repair path against the installed runtime
        shell: cmd
        run: call "%FLEECE_RELEASE_ROOT%\Installer.bat" --yes --no-pause

      - name: Download and convert a local media fixture on Windows 11 ARM
        if: matrix.runner == 'windows-11-arm'
        shell: powershell
        run: '& "$env:FLEECE_RELEASE_ROOT\.runtime\python\python.exe" -I ".github/scripts/Test-DownloadWorkflow.py" "$env:FLEECE_RELEASE_ROOT"'

      - name: Upload diagnostics if a gate fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: setup-diagnostics-${{ matrix.runner }}-${{ github.run_id }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            setup.log
            .runtime/error.log
            .runtime/logs/*.log
            ${{ runner.temp }}/Video Downloader release QA/setup.log
            ${{ runner.temp }}/Video Downloader release QA/.runtime/error.log
            ${{ runner.temp }}/Video Downloader release QA/.runtime/logs/*.log
